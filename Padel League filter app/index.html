<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PadelLeague Card Generator — Fixed Layout</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Bungee&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <div class="padel-generator">
        <!-- SVG motion blur filter definition (kept small) -->
        <svg
          style="position: absolute; width: 0; height: 0; overflow: hidden"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <filter id="motion-blur">
              <feGaussianBlur in="SourceGraphic" stdDeviation="0 0" />
            </filter>
          </defs>
        </svg>

        <div class="preview-container">
          <img
            id="user-image"
            class="base-image"
            src="https://images.unsplash.com/photo-1626224484214-4051d04474f3?q=80&w=1000&auto=format&fit=crop"
            alt="Court preview"
          />

          <div id="filter-grain" class="overlay overlay-grain hidden"></div>
          <div id="filter-grid" class="overlay overlay-grid hidden"></div>
          <div id="filter-tint" class="overlay overlay-tint hidden"></div>

          <div
            class="result-card"
            role="region"
            aria-label="Result card preview"
          >
            <div class="card-inner">
              <div class="info-group">
                <div class="info-label">Name</div>
                <div id="display-name" class="info-value player-name">
                  PLAYER NAME
                </div>
              </div>

              <div class="info-group">
                <div class="info-label">Skill Level</div>
                <div id="display-level" class="info-value">7 - ELITA</div>
              </div>

              <div class="info-group">
                <div class="info-label">Result</div>
                <div id="display-result" class="info-value winner">VICTORY</div>
              </div>

              <div class="badge-container" aria-hidden="true">
                <svg class="curved-text-svg" viewBox="0 0 120 120">
                  <path
                    id="curve"
                    d="M 15 70 A 45 45 0 1 1 105 70"
                    fill="transparent"
                  />
                  <text>
                    <textPath
                      href="#curve"
                      startOffset="50%"
                      text-anchor="middle"
                    >
                      Matches Won
                    </textPath>
                  </text>
                </svg>
                <div id="badge-text" class="badge-circle">8/10</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls panel placed below the phone simulator -->
      <div class="controls-panel" role="form" aria-label="Controls">
        <div class="control-group">
          <label class="control-label">Upload Court Image</label>
          <input id="upload" type="file" accept="image/*" class="file-input" />
        </div>

        <div class="control-group">
          <label class="control-label">Filter Controls</label>
          <div class="toggle-grid">
            <button id="btn-grain" class="toggle-btn" type="button">
              Grain
            </button>
            <button id="btn-grid" class="toggle-btn" type="button">Grid</button>
            <button id="btn-blur" class="toggle-btn" type="button">Blur</button>
            <button id="btn-tint" class="toggle-btn" type="button">Tint</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label"
            >Blur Intensity: <span id="blur-value">0</span></label
          >
          <input
            id="blur-range"
            class="slider-input"
            type="range"
            min="0"
            max="10"
            value="0"
          />
        </div>

        <div class="control-group">
          <label class="control-label">Player Name</label>
          <input
            id="name-input"
            class="text-input"
            type="text"
            value="PLAYER NAME"
          />
        </div>

        <div class="control-group">
          <label class="control-label">Skill Level</label>
          <input
            id="level-input"
            class="text-input"
            type="text"
            value="7 - ELITA"
          />
        </div>

        <div class="control-group">
          <label class="control-label">Match Result</label>
          <select id="result-input" class="text-input">
            <option>VICTORY</option>
            <option>DEFEAT</option>
            <option>DRAW</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Matches Won</label>
          <input
            id="matches-won-input"
            class="text-input"
            type="number"
            min="0"
            value="7"
          />
        </div>

        <div class="control-group">
          <label class="control-label">Total Matches Played</label>
          <input
            id="matches-total-input"
            class="text-input"
            type="number"
            min="1"
            value="10"
          />
        </div>
      </div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
